
# ============================================================
# SISTEMA DE GESTION DE CITAS ODONTOLOGICAS
# Consultorio Odontologico Dra. Magda Ortiz (SGCO)
# ============================================================
#
# Configuracion general de Spring Boot.
#
# Esta configuracion permite ejecutar el proyecto localmente
# y preparar su despliegue en una plataforma como Render.
#
# Los valores de conexion y seguridad se pueden proporcionar
# mediante variables de entorno.
#
# ============================================================


# ============================================================
# CONFIGURACION GENERAL DE LA APLICACION
# ============================================================

# Nombre del proyecto Spring Boot.
spring.application.name=sgcodramagdaortiz

# Puerto del servidor.
# Render puede proporcionar el puerto mediante PORT.
server.port=${PORT:8765}


# ============================================================
# CONFIGURACION DE LA BASE DE DATOS MYSQL
# ============================================================
#
# Para desarrollo local se utilizan los valores predeterminados.
# En Render deben configurarse las variables de entorno
# correspondientes a la base de datos alojada en la nube.
#
# IMPORTANTE:
# No se deben publicar contrasenas reales en este archivo.
#
# ============================================================

# URL de conexion JDBC a MySQL.
spring.datasource.url=${SPRING_DATASOURCE_URL:jdbc:mysql://localhost:3306/sgco_dramagdaortiz}

# Usuario de la base de datos.
spring.datasource.username=${SPRING_DATASOURCE_USERNAME:root}

# Contrasena de la base de datos.
spring.datasource.password=${SPRING_DATASOURCE_PASSWORD:root}

# Driver JDBC utilizado por MySQL.
spring.datasource.driver-class-name=com.mysql.cj.jdbc.Driver


# ============================================================
# CONFIGURACION JPA / HIBERNATE
# ============================================================

# Durante el desarrollo se actualiza el esquema existente.
# Para produccion se recomienda revisar y controlar las
# migraciones de base de datos antes de habilitar el servicio.
spring.jpa.hibernate.ddl-auto=${SPRING_JPA_DDL_AUTO:update}

# Mostrar consultas SQL en la consola.
spring.jpa.show-sql=${SPRING_JPA_SHOW_SQL:false}

# Formatear las consultas SQL para facilitar su lectura.
spring.jpa.properties.hibernate.format_sql=${SPRING_JPA_FORMAT_SQL:false}

# Evita mantener abierta la sesion de Hibernate durante
# el renderizado de las vistas.
spring.jpa.open-in-view=false


# ============================================================
# CONFIGURACION DE CODIFICACION
# ============================================================

# Permite manejar correctamente caracteres especiales.
spring.datasource.hikari.connection-init-sql=SET NAMES utf8mb4


# ============================================================
# CONFIGURACION DE REGISTROS
# ============================================================

# En produccion se evita registrar todas las consultas SQL.
logging.level.org.hibernate.SQL=${LOGGING_LEVEL_HIBERNATE_SQL:WARN}


# ============================================================
# CONFIGURACION JWT
# ============================================================
#
# La clave secreta debe proporcionarse como variable de
# entorno en Render.
#
# No se establece una clave secreta predeterminada para evitar
# que el despliegue utilice accidentalmente una clave publica
# o conocida.
#
# ============================================================

# Clave secreta utilizada para firmar y validar los tokens JWT.
jwt.secret=${JWT_SECRET}

# Duracion del token en milisegundos.
# 86400000 milisegundos equivalen a 24 horas.
jwt.expiration=${JWT_EXPIRATION:86400000}
